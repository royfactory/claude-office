<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 단색 빌딩: 몸통에 창문 구멍 2×2 와 문, 지붕 안테나. 16px 에서도 뭉개지지 않게 큼직하게. 배경 투명 -->
  <defs>
    <mask id="w">
      <rect width="64" height="64" fill="#fff"/>
      <g fill="#000">
        <rect x="19" y="21" width="10" height="9" rx="1.5"/><rect x="35" y="21" width="10" height="9" rx="1.5"/>
        <rect x="19" y="35" width="10" height="9" rx="1.5"/><rect x="35" y="35" width="10" height="9" rx="1.5"/>
        <rect x="27" y="48" width="10" height="12"/>
      </g>
    </mask>
  </defs>
  <g fill="#d97757">
    <rect x="29.5" y="4" width="5" height="11" rx="2.5"/>
    <rect x="12" y="13" width="40" height="45" rx="5" mask="url(#w)"/>
  </g>
</svg>
