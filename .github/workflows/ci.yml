name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    # 수집기는 표준 라이브러리만 쓰고 macOS 기본 /usr/bin/python3(3.9)에서도 돌아야 한다
    name: collector (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_collector.py

  hub:
    name: hub (ubuntu-latest, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -r hub/requirements.txt
      - run: python -m pytest -q
