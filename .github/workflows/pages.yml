# 시연 화면(가짜 데이터)을 GitHub Pages 에 올린다 — https://royfactory.net/claude-office/
# 화면 코드(hub/static)·기본 캐릭터·빌드 스크립트가 바뀌어 main 에 들어오면 다시 만든다.
name: Demo (Pages)

on:
  push:
    branches: [main]
    paths: ["hub/**", "scripts/build_demo.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r hub/requirements.txt
      - run: python scripts/build_demo.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
